name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q LiquidTV.zip
      - name: Fix UnstableApi
        run: |
          F=LiquidTV/app/src/main/java/ru/garant/liquidtv/MainActivity.kt
          sed -i 's/^import androidx.media3.common.Player$/import androidx.media3.common.Player\nimport androidx.media3.common.util.UnstableApi/' $F
          sed -i 's/@OptIn(ExperimentalFoundationApi::class)/@OptIn(ExperimentalFoundationApi::class, UnstableApi::class)/' $F

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.7" }
      - run: gradle assembleDebug
        working-directory: LiquidTV
      - uses: actions/upload-artifact@v4
        with: { name: LiquidTV-apk, path: LiquidTV/app/build/outputs/apk/debug/*.apk }
